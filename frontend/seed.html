<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Firestore — Curfee</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 16px; padding: 40px; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    h1 { color: #2d6a4f; margin-bottom: 8px; }
    p { color: #64748b; }
    button { background: linear-gradient(135deg, #2d6a4f, #40916c); color: #fff; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1rem; cursor: pointer; margin-top: 20px; }
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(45,106,79,0.3); }
    #status { margin-top: 20px; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; text-align: left; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    .success { background: #f0fdf4; color: #166534; }
    .error { background: #fef2f2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌱 Seed Firestore</h1>
    <p>Click the button below to populate your Firestore database with sample products and admin config.</p>
    <p style="color:#e53e3e;font-size:0.85rem;">⚠️ Run this ONCE only. Delete this file after seeding.</p>
    <button onclick="runSeed()">Seed Database</button>
    <div id="status"></div>
  </div>
  <script src="js/seed-firestore.js"></script>
  <script>
    async function runSeed() {
      const status = document.getElementById('status');
      status.className = '';
      status.textContent = '⏳ Seeding...';
      try {
        await seedFirestore();
        status.className = 'success';
        status.textContent = '✅ Database seeded successfully!\n\nYou can now:\n1. Go to index.html to see products\n2. Register/login to test cart\n3. Delete this seed.html file';
      } catch (e) {
        status.className = 'error';
        status.textContent = '❌ Error: ' + e.message + '\n\nMake sure:\n1. Firestore is enabled in Firebase Console\n2. Rules are set to allow writes from your email';
      }
    }
  </script>
</body>
</html>
