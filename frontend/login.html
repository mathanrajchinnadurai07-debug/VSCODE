<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — <span data-brand='full-name'>Curfee Organic Market</span></title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><script src='js/branding.js'></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo"><a href="index.html" class="logo" style="justify-content:center;"><div class="logo-icon"><span data-brand='logo-emoji'>🌿</span></div> <span data-brand='name'>Curfee</span><span>Organic</span></a></div>
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Login to access your organic marketplace</p>
      <div class="auth-tabs"><button class="auth-tab active" onclick="switchAuthTab('login',this)">Login</button><button class="auth-tab" onclick="switchAuthTab('register',this)">Register</button><button class="auth-tab" onclick="switchAuthTab('otp',this)">OTP Login</button></div>
      <div class="social-login"><button class="social-btn" onclick="googleLogin()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G"> Continue with Google</button></div>
      <div class="auth-divider">or</div>
      <form id="loginForm"><div class="form-group"><label>Email</label><input type="email" id="loginEmail" required placeholder="you@example.com" value=""></div><div class="form-group"><label>Password</label><input type="password" id="loginPassword" required placeholder="Enter password" value=""></div><button type="submit" class="btn btn-primary btn-block">Login <i class="fas fa-arrow-right"></i></button></form>
      <form id="registerForm" class="hidden"><div class="form-group"><label>Full Name</label><input type="text" id="regName" required placeholder="John Doe"></div><div class="form-group"><label>Email</label><input type="email" id="regEmail" required placeholder="you@example.com"></div><div class="form-group"><label>Phone</label><input type="tel" id="regPhone" placeholder="9876543210"></div><div class="form-group"><label>Password</label><input type="password" id="regPassword" required placeholder="Min 6 characters"></div><button type="submit" class="btn btn-primary btn-block">Create Account <i class="fas fa-user-plus"></i></button></form>
      <form id="otpForm" class="hidden"><div class="form-group"><label>Mobile Number</label><input type="tel" id="otpPhone" required placeholder="Enter 10-digit number"></div><div class="form-group hidden" id="otpInputGroup"><label>OTP</label><input type="text" id="otpCode" placeholder="Enter 6-digit OTP" maxlength="6"></div><button type="submit" class="btn btn-primary btn-block" id="otpBtn">Send OTP <i class="fas fa-mobile-alt"></i></button></form>
      <p style="text-align:center;margin-top:16px;font-size:0.8rem;color:var(--text-light);">&nbsp;</p>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div><div id="cartCount" style="display:none"></div><div id="wishlistCount" style="display:none"></div>
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
</body></html>
