<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Panel — Curfee Organic Market</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">🌿 Curfee Admin</div>
      <nav><a href="#" class="active" data-section="dashboard"><i class="fas fa-chart-line"></i> Dashboard</a><a href="#" data-section="products"><i class="fas fa-box"></i> Products</a><a href="#" data-section="orders"><i class="fas fa-shopping-bag"></i> Orders</a><a href="#" data-section="customers"><i class="fas fa-users"></i> Customers</a><a href="#" data-section="addproduct"><i class="fas fa-plus-circle"></i> Add Product</a><a href="index.html" style="margin-top:30px;"><i class="fas fa-store"></i> View Store</a><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></nav>
    </aside>
    <main class="admin-content">
      <div id="section-dashboard"><h1 style="font-size:1.5rem;margin-bottom:24px;">📊 Sales Dashboard</h1><div class="stat-cards"><div class="stat-card"><div class="stat-icon" style="background:rgba(45,106,79,0.1);color:var(--primary);"><i class="fas fa-rupee-sign"></i></div><div><div class="stat-value" id="totalRevenue">₹0</div><div class="stat-label">Total Revenue</div></div></div><div class="stat-card"><div class="stat-icon" style="background:rgba(247,127,0,0.1);color:var(--accent);"><i class="fas fa-shopping-bag"></i></div><div><div class="stat-value" id="totalOrders">0</div><div class="stat-label">Total Orders</div></div></div><div class="stat-card"><div class="stat-icon" style="background:rgba(155,89,182,0.1);color:#9b59b6;"><i class="fas fa-users"></i></div><div><div class="stat-value" id="totalCustomers">0</div><div class="stat-label">Customers</div></div></div><div class="stat-card"><div class="stat-icon" style="background:rgba(46,204,113,0.1);color:#2ecc71;"><i class="fas fa-box"></i></div><div><div class="stat-value" id="totalProducts">20</div><div class="stat-label">Products</div></div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;"><div style="background:#fff;padding:24px;border-radius:var(--radius);box-shadow:var(--shadow);"><h3 style="margin-bottom:16px;">Recent Orders</h3><div id="recentOrders" style="font-size:0.85rem;"></div></div><div style="background:#fff;padding:24px;border-radius:var(--radius);box-shadow:var(--shadow);"><h3 style="margin-bottom:16px;">Top Products</h3><div id="topProducts" style="font-size:0.85rem;"></div></div></div></div>
      <div id="section-products" class="hidden"><h1 style="font-size:1.5rem;margin-bottom:24px;"><i class="fas fa-box"></i> Product Management</h1><div id="productTable"></div></div>
      <div id="section-orders" class="hidden"><h1 style="font-size:1.5rem;margin-bottom:24px;"><i class="fas fa-shopping-bag"></i> Order Management</h1><div id="adminOrdersList"></div></div>
      <div id="section-customers" class="hidden"><h1 style="font-size:1.5rem;margin-bottom:24px;"><i class="fas fa-users"></i> Customer Management</h1><div id="customerList"></div></div>
      <div id="section-addproduct" class="hidden"><h1 style="font-size:1.5rem;margin-bottom:24px;"><i class="fas fa-plus-circle"></i> Add New Product</h1><form id="addProductForm" style="max-width:600px;"><div class="form-row"><div class="form-group"><label>Product Name</label><input type="text" id="pName" required></div><div class="form-group"><label>Category</label><select id="pCategory" required><option value="vegetables">Vegetables</option><option value="fruits">Fruits</option><option value="dairy">Dairy</option></select></div></div><div class="form-group"><label>Description</label><textarea id="pDesc" rows="3" required></textarea></div><div class="form-row"><div class="form-group"><label>Price (₹)</label><input type="number" id="pPrice" required></div><div class="form-group"><label>Discount Price (₹)</label><input type="number" id="pDiscPrice"></div></div><div class="form-row"><div class="form-group"><label>Stock</label><input type="number" id="pStock" value="100"></div><div class="form-group"><label>Image URL</label><input type="text" id="pImage" placeholder="Optional"></div></div><div class="form-group"><label><input type="checkbox" id="pFeatured"> Featured Product</label></div><button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Product</button></form></div>
    </main>
  </div>
  <div class="toast-container" id="toastContainer"></div><div id="cartCount" style="display:none"></div><div id="wishlistCount" style="display:none"></div>
  <script src="js/app.js"></script><script src="js/admin.js"></script>
</body></html>
