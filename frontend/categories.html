<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Browse 200+ organic products across 16 categories at Curfee Organic Market.">
  <title>Categories — Curfee Organic Market</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/flipkart-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { margin:0; font-family:'Inter','Segoe UI',system-ui,sans-serif; background:#f5f5f5; }

    /* Header */
    .cat-header { position:sticky; top:0; z-index:100; background:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
    .cat-header h1 { font-size:1.15rem; font-weight:700; margin:0; }
    .cat-header-actions { display:flex; gap:20px; }
    .cat-header-actions a { color:#333; font-size:1.2rem; text-decoration:none; position:relative; }
    .cat-header-actions .cart-badge { position:absolute; top:-6px; right:-8px; background:#e53935; color:#fff; border-radius:50%; font-size:0.6rem; width:16px; height:16px; display:flex; align-items:center; justify-content:center; font-weight:700; }

    /* Split Layout */
    .cat-split { display:flex; height:calc(100vh - 120px); overflow:hidden; }

    /* Left sidebar */
    .cat-sidebar { width:80px; min-width:80px; background:#fff; overflow-y:auto; border-right:1px solid #eee; scrollbar-width:none; }
    .cat-sidebar::-webkit-scrollbar { display:none; }
    .cat-sidebar-item { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px 4px 10px; text-decoration:none; color:#666; font-size:0.65rem; text-align:center; border-left:3px solid transparent; transition:all 0.2s; gap:6px; cursor:pointer; }
    .cat-sidebar-item.active { color:#2d6a4f; border-left-color:#2d6a4f; background:#f0faf5; }
    .cat-sidebar-item:hover { background:#f8f8f8; }
    .cat-sidebar-item .icon-wrap { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; background:#f8f8f8; }
    .cat-sidebar-item.active .icon-wrap { background:linear-gradient(135deg,#e8f5e9,#c8e6c9); }
    .cat-sidebar-item span { line-height:1.2; font-weight:500; max-width:70px; overflow:hidden; text-overflow:ellipsis; }

    /* Right content */
    .cat-content { flex:1; overflow-y:auto; background:#fff; padding:0 0 80px; }
    .cat-content-header { padding:20px 16px 8px; }
    .cat-content-header h2 { font-size:1.1rem; font-weight:700; margin:0 0 4px; color:#1a1a1a; }
    .cat-content-header p { font-size:0.78rem; color:#999; margin:0; }

    /* Product grid inside content */
    .cat-products { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:12px 16px; }
    .cat-prod-card { text-decoration:none; color:#1a1a1a; text-align:center; }
    .cat-prod-card .prod-img { width:100%; aspect-ratio:1; border-radius:12px; background:#f8f8f8; display:flex; align-items:center; justify-content:center; font-size:2.5rem; overflow:hidden; border:1px solid #f0f0f0; }
    .cat-prod-card .prod-img img { width:100%; height:100%; object-fit:cover; }
    .cat-prod-card .prod-name { font-size:0.72rem; margin-top:6px; color:#333; font-weight:500; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    /* Banner inside content */
    .cat-banner { margin:12px 16px; border-radius:12px; padding:20px; background:linear-gradient(135deg,#e8f5e9,#c8e6c9); text-align:center; }
    .cat-banner h3 { font-size:1rem; color:#2d6a4f; margin:0 0 4px; }
    .cat-banner p { font-size:0.78rem; color:#555; margin:0 0 12px; }
    .cat-banner a { display:inline-block; background:#2d6a4f; color:#fff; padding:8px 24px; border-radius:20px; font-size:0.8rem; font-weight:600; text-decoration:none; }

    /* Section divider */
    .cat-section-title { padding:16px 16px 8px; font-size:0.9rem; font-weight:700; color:#1a1a1a; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="cat-header">
    <h1>All Categories</h1>
    <div class="cat-header-actions">
      <a href="products.html"><i class="fas fa-search"></i></a>
      <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="cart-badge" id="cartCount" style="display:none">0</span></a>
    </div>
  </div>

  <!-- Split Layout -->
  <div class="cat-split">

    <!-- Left Sidebar -->
    <div class="cat-sidebar" id="catSidebar">
      <a class="cat-sidebar-item active" data-cat="foryou">
        <div class="icon-wrap">🏠</div>
        <span>For You</span>
      </a>
      <a class="cat-sidebar-item" data-cat="vegetables">
        <div class="icon-wrap">🥬</div>
        <span>Vegetables</span>
      </a>
      <a class="cat-sidebar-item" data-cat="fruits">
        <div class="icon-wrap">🍎</div>
        <span>Fruits</span>
      </a>
      <a class="cat-sidebar-item" data-cat="biscuits">
        <div class="icon-wrap">🍪</div>
        <span>Biscuits</span>
      </a>
      <a class="cat-sidebar-item" data-cat="snacks">
        <div class="icon-wrap">🥜</div>
        <span>Snacks</span>
      </a>
      <a class="cat-sidebar-item" data-cat="mushroom">
        <div class="icon-wrap">🍄</div>
        <span>Mushroom</span>
      </a>
      <a class="cat-sidebar-item" data-cat="chicken">
        <div class="icon-wrap">🍗</div>
        <span>Chicken</span>
      </a>
      <a class="cat-sidebar-item" data-cat="mutton">
        <div class="icon-wrap">🍖</div>
        <span>Mutton</span>
      </a>
      <a class="cat-sidebar-item" data-cat="grocery">
        <div class="icon-wrap">🏪</div>
        <span>Grocery</span>
      </a>
      <a class="cat-sidebar-item" data-cat="dryfruits">
        <div class="icon-wrap">🥜</div>
        <span>Dry Fruits</span>
      </a>
      <a class="cat-sidebar-item" data-cat="herbal">
        <div class="icon-wrap">🌿</div>
        <span>Herbal</span>
      </a>
      <a class="cat-sidebar-item" data-cat="flour">
        <div class="icon-wrap">🌾</div>
        <span>Flour</span>
      </a>
      <a class="cat-sidebar-item" data-cat="beverages">
        <div class="icon-wrap">☕</div>
        <span>Beverages</span>
      </a>
      <a class="cat-sidebar-item" data-cat="spreads">
        <div class="icon-wrap">🍯</div>
        <span>Spreads</span>
      </a>
      <a class="cat-sidebar-item" data-cat="pickles">
        <div class="icon-wrap">🥒</div>
        <span>Pickles</span>
      </a>
      <a class="cat-sidebar-item" data-cat="superfoods">
        <div class="icon-wrap">🧬</div>
        <span>Superfoods</span>
      </a>
      <a class="cat-sidebar-item" data-cat="readytocook">
        <div class="icon-wrap">🍲</div>
        <span>Ready Cook</span>
      </a>
    </div>

    <!-- Right Content -->
    <div class="cat-content" id="catContent">
      <!-- Dynamically filled by JS -->
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="fk-bottom-nav">
    <a href="index.html" class="fk-bnav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="categories.html" class="fk-bnav-item active"><i class="fas fa-th-large"></i><span>Categories</span></a>
    <a href="products.html?featured=true" class="fk-bnav-item"><i class="fas fa-star"></i><span>Top Picks</span></a>
    <a href="dashboard.html" class="fk-bnav-item"><i class="fas fa-user"></i><span>Account</span></a>
    <a href="cart.html" class="fk-bnav-item"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
  </nav>

  <div class="toast-container" id="toastContainer"></div>
  <script src="js/app.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/products-data2.js"></script>
  <script>
    const catContent = document.getElementById('catContent');
    const sidebarItems = document.querySelectorAll('.cat-sidebar-item');

    // Category meta
    const catMeta = {
      foryou:     { title:'For You',              sub:'Curated picks based on popular organic products' },
      vegetables: { title:'Fresh Vegetables',     sub:'Pesticide-free, farm-fresh organic vegetables' },
      fruits:     { title:'Fresh Fruits',          sub:'Naturally grown, seasonal organic fruits' },
      biscuits:   { title:'Biscuits & Cookies',   sub:'Millet, ragi, jaggery — zero refined sugar' },
      snacks:     { title:'Snacks & Chips',       sub:'Banana chips, quinoa puffs, makhana & more' },
      mushroom:   { title:'Mushroom Products',    sub:'Dried, powder, soup mix, coffee blend' },
      chicken:    { title:'Organic Chicken',       sub:'Antibiotic-free, vacuum sealed & fresh' },
      mutton:     { title:'Organic Mutton',        sub:'Premium goat meat — curry cut, mince, kebab' },
      grocery:    { title:'Grocery Essentials',    sub:'Honey, oils, dal, rice, spices & more' },
      dryfruits:  { title:'Dry Fruits & Nuts',     sub:'Almonds, cashews, walnuts, pistachios, seeds' },
      herbal:     { title:'Herbal & Personal Care',sub:'Soaps, oils, shampoo, lip balm, face care' },
      flour:      { title:'Flour & Grains',        sub:'Wheat, ragi, bajra, jowar, quinoa, oats' },
      beverages:  { title:'Tea & Coffee',          sub:'Green tea, masala chai, filter coffee' },
      spreads:    { title:'Honey & Spreads',       sub:'Raw honey, peanut butter, almond butter' },
      pickles:    { title:'Pickles & Chutneys',    sub:'Mango, lemon, garlic pickle, chutney' },
      superfoods: { title:'Superfoods',            sub:'Chia seeds, moringa, spirulina, ashwagandha' },
      readytocook:{ title:'Ready to Cook',         sub:'Dosa, idli, upma, khichdi, pancake mixes' }
    };

    function getEmoji(cat) {
      const map = {vegetables:'🥬',fruits:'🍎',biscuits:'🍪',snacks:'🥜',mushroom:'🍄',chicken:'🍗',mutton:'🍖',grocery:'🏪',dryfruits:'🥜',herbal:'🌿',flour:'🌾',beverages:'☕',spreads:'🍯',pickles:'🥒',superfoods:'🧬',readytocook:'🍲'};
      return map[cat]||'🌿';
    }

    function loadCategoryContent(cat) {
      // Update sidebar active state
      sidebarItems.forEach(s => s.classList.remove('active'));
      document.querySelector(`[data-cat="${cat}"]`)?.classList.add('active');

      const meta = catMeta[cat] || catMeta.foryou;
      const allData = (typeof ALL_PRODUCTS!=='undefined'?ALL_PRODUCTS:[]).concat(typeof ALL_PRODUCTS_PART2!=='undefined'?ALL_PRODUCTS_PART2:[]);

      if (cat === 'foryou') {
        // Show "For You" — featured/popular picks across all categories
        const featured = allData.filter(p => p.isFeatured || p.isBestSeller).slice(0,9);
        const popular = allData.sort((a,b)=>b.rating-a.rating).slice(0,6);

        catContent.innerHTML = `
          <div class="cat-content-header"><h2>${meta.title}</h2><p>${meta.sub}</p></div>
          <div class="cat-banner">
            <h3>🌿 Organic Market</h3>
            <p>200+ products across 16 categories</p>
            <a href="products.html">Shop All →</a>
          </div>
          <div class="cat-section-title">⭐ Featured Products</div>
          <div class="cat-products">${featured.map(p => prodCard(p)).join('')}</div>
          <div class="cat-section-title">🔥 Popular This Week</div>
          <div class="cat-products">${popular.map(p => prodCard(p)).join('')}</div>
          <div class="cat-section-title">📦 Browse by Category</div>
          <div class="cat-products">
            ${Object.keys(catMeta).filter(c=>c!=='foryou').map(c => `
              <a href="products.html?category=${c}" class="cat-prod-card">
                <div class="prod-img">${getEmoji(c)}</div>
                <div class="prod-name">${catMeta[c].title}</div>
              </a>
            `).join('')}
          </div>
        `;
      } else {
        // Show specific category products
        const products = allData.filter(p => p.category === cat);
        catContent.innerHTML = `
          <div class="cat-content-header"><h2>${meta.title}</h2><p>${meta.sub}</p></div>
          <a href="products.html?category=${cat}" style="display:block;margin:8px 16px;padding:10px;background:#f0faf5;border-radius:8px;text-decoration:none;color:#2d6a4f;font-size:0.82rem;font-weight:600;text-align:center;">View All ${meta.title} →</a>
          ${products.length ? `<div class="cat-products">${products.slice(0,12).map(p => prodCard(p)).join('')}</div>` : '<p style="padding:40px;text-align:center;color:#999;">No products found in this category yet.</p>'}
          ${products.length > 12 ? `<a href="products.html?category=${cat}" style="display:block;margin:8px 16px 20px;padding:12px;background:#2d6a4f;color:#fff;border-radius:8px;text-decoration:none;font-size:0.85rem;font-weight:600;text-align:center;">See All ${products.length} Products →</a>` : ''}
        `;
      }
      catContent.scrollTop = 0;
    }

    function prodCard(p) {
      const price = p.discountPrice || p.price;
      const emoji = getEmoji(p.category);
      const imgSrc = p.images && p.images.length ? p.images[0] : '';
      return `
        <a href="product-detail.html?slug=${p.slug}" class="cat-prod-card">
          <div class="prod-img">${imgSrc ? `<img src="${imgSrc}" alt="${p.name}">` : emoji}</div>
          <div class="prod-name">${p.name}</div>
          <div style="font-size:0.72rem;color:#2d6a4f;font-weight:700;margin-top:2px;">₹${price}</div>
        </a>`;
    }

    // Sidebar click handlers
    sidebarItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        loadCategoryContent(item.dataset.cat);
      });
    });

    // Load default
    loadCategoryContent('foryou');
  </script>
</body>
</html>
